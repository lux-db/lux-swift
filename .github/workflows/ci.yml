name: Swift

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS package
        run: >-
          xcodebuild build
          -scheme Lux
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
